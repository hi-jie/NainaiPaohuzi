name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
      - run: node scripts/update-music.mjs --playlist-only
      - name: Stage Pages with the latest released Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-release"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'NainaiPaohuzi-*-release.apk' --dir "$RUNNER_TEMP/android-release"
          cp -a android/app/src/main/assets/www "$RUNNER_TEMP/pages"
          python3 scripts/stage-android-update.py "$RUNNER_TEMP/android-release" "$RUNNER_TEMP/pages"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages
      - uses: actions/deploy-pages@v4
        id: deployment
