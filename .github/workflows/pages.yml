name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/update-music.mjs --playlist-only
      - name: Set the version shown in web settings
        run: |
          version=$(jq -er '.versionName | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' android/app/version.json)
          sed -i "s/data-web-version=\"\"/data-web-version=\"$version\"/" android/app/src/main/assets/www/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: android/app/src/main/assets/www
      - uses: actions/deploy-pages@v4
        id: deployment
