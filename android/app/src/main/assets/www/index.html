<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#113f32">
  <title>衡阳跑胡子</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png">
  <link rel="stylesheet" href="./css/app.css?v=266">
  <script>
  /* 诊断兜底：主脚本 4 秒内没有启动时（常见于系统 WebView 过旧的设备），用 ES5 内联脚本显示可读的诊断信息，避免只剩一片绿色。 */
  (function () {
    var errors = [];
    var panel = null;
    var poll = null;
    var errorList = null;
    var mini = null;

    function remember(kind, message) {
      if (errors.length >= 10) return;
      errors.push({ kind: kind, message: String(message || '').slice(0, 300) });
      renderErrors();
    }
    window.__paohuziStarted = false;
    window.__paohuziDiagnostics = errors;
    window.__paohuziShowDiagnostics = show;

    window.addEventListener('error', function (event) {
      if (event && event.target && event.target !== window && event.target.tagName) {
        remember('资源加载失败', event.target.tagName + ' ' + (event.target.src || event.target.href || ''));
      } else {
        remember('脚本错误', (event && event.message ? event.message : '未知错误') +
          (event && event.filename ? '（' + event.filename + ':' + event.lineno + '）' : ''));
      }
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason;
      remember('Promise 错误', reason && reason.message ? reason.message : String(reason));
    });

    function element(tag, cssText, text) {
      var node = document.createElement(tag);
      if (cssText) node.style.cssText = cssText;
      if (text !== undefined && text !== null) node.textContent = String(text);
      return node;
    }
    function cssSupports(property, value) {
      try { return !!(window.CSS && CSS.supports && CSS.supports(property, value)); } catch (error) { return false; }
    }
    function jsFeature(source) {
      try { return Boolean(new Function(source)()); } catch (error) { return false; }
    }
    function flexGap() {
      try {
        var box = element('div', 'display:flex;column-gap:10px;position:absolute;visibility:hidden;left:-9999px;top:0;');
        var first = element('div', 'width:10px;height:1px;flex:none;');
        var second = element('div', 'width:10px;height:1px;flex:none;');
        box.appendChild(first);
        box.appendChild(second);
        document.body.appendChild(box);
        var supported = Math.round(second.getBoundingClientRect().left - first.getBoundingClientRect().left) >= 19;
        box.parentNode.removeChild(box);
        return supported;
      } catch (error) { return false; }
    }
    function chromeVersion() {
      var match = /Chrome\/(\d+)/.exec(navigator.userAgent || '');
      return match ? Number(match[1]) : 0;
    }
    function nativeWebView() {
      try {
        if (window.paohuziDiagnosticsNative && window.paohuziDiagnosticsNative.webViewInfo) {
          return String(window.paohuziDiagnosticsNative.webViewInfo());
        }
      } catch (error) { return '读取失败：' + error; }
      return '';
    }

    function addSection(box, title, rows) {
      box.appendChild(element('h3', 'margin:18px 0 6px;font-size:18px;color:#ffe2a0;', title));
      for (var index = 0; index < rows.length; index++) addRow(box, rows[index][0], rows[index][1], rows[index][2]);
    }
    function addRow(box, label, value, bad) {
      var row = element('div', 'padding:5px 0;border-bottom:1px solid #ffffff1f;word-break:break-all;');
      row.appendChild(element('strong', 'display:inline-block;min-width:12em;padding-right:12px;color:#ffe6b9;font-weight:700;vertical-align:top;', label));
      row.appendChild(element('span', 'color:' + (bad ? '#ffb4a0' : '#d8f0e2') + ';', value));
      box.appendChild(row);
    }

    function renderErrors() {
      if (!errorList) return;
      while (errorList.firstChild) errorList.removeChild(errorList.firstChild);
      if (!errors.length) {
        errorList.appendChild(element('p', 'margin:4px 0;color:#8fc9ab;', '暂无记录（可能是页面脚本被直接忽略，或错误没有上报）'));
        return;
      }
      for (var index = 0; index < errors.length; index++) {
        errorList.appendChild(element('p', 'margin:4px 0;color:#ffcfc2;', '· ' + errors[index].kind + '：' + errors[index].message));
      }
    }

    function hide() {
      if (poll) { window.clearInterval(poll); poll = null; }
      if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
      panel = null;
      errorList = null;
    }
    function miniButton() {
      if (mini) return;
      mini = element('button', 'position:fixed;left:12px;bottom:12px;z-index:2147483646;padding:8px 14px;border-radius:8px;border:1px solid #d6a35e;background:#1d4538;color:#ffe6b9;font:15px system-ui,sans-serif;', '诊断信息');
      mini.onclick = function () { show(); };
      document.body.appendChild(mini);
    }

    function show() {
      if (panel || window.__paohuziStarted) return;
      var chrome = chromeVersion();
      var native = nativeWebView();
      var mainElement = document.querySelector('main');
      var homeElement = document.querySelector('#home');
      var mainRect = mainElement ? mainElement.getBoundingClientRect() : null;
      var homeRect = homeElement ? homeElement.getBoundingClientRect() : null;
      var mainHeight = '未找到 <main>';
      if (mainElement) {
        mainHeight = Math.round(mainRect.height) + 'px';
        var computed = window.getComputedStyle(mainElement);
        if (computed && computed.height) mainHeight += '（计算值 ' + computed.height + '）';
      }
      var dvh = cssSupports('height', '100dvh');
      var clamp = cssSupports('width', 'clamp(1px,2px,3px)');
      var has = cssSupports('selector(:has(*))');
      var is = cssSupports('selector(:is(a))');
      var where = cssSupports('selector(:where(a))');
      var grid = cssSupports('display', 'grid');
      var safeArea = cssSupports('padding-top', 'env(safe-area-inset-top)');
      var inset = cssSupports('inset', '0px');
      var translate = cssSupports('translate', '1px');
      var aspect = cssSupports('aspect-ratio', '1');
      var subgrid = cssSupports('grid-template-columns', 'subgrid');
      var container = cssSupports('container-type', 'inline-size');
      var backdrop = cssSupports('backdrop-filter', 'blur(1px)');
      var flexGapOk = flexGap();
      var getAnimations = jsFeature('return typeof Element.prototype.getAnimations === "function"');
      var finished = jsFeature('return typeof Animation !== "undefined" && "finished" in Animation.prototype');

      panel = element('div', 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:2147483647;overflow:auto;' +
        'background:#0d241f;color:#f2ecd9;padding:26px 24px 44px;font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif;');
      panel.id = 'paohuzi-diagnostics';
      var box = element('div', 'max-width:980px;margin:0 auto;');
      panel.appendChild(box);
      box.appendChild(element('h2', 'margin:0 0 4px;font-size:26px;color:#ffe2a0;', '游戏页面没有正常启动'));
      box.appendChild(element('p', 'margin:0 0 8px;font-size:17px;color:#f3d9a4;',
        '这是诊断信息页。常见原因是这台设备的系统 WebView（浏览器内核）太旧或已停用。请把本页截图发给开发者；' +
        '也可以先用平板浏览器打开网页版：https://hi-jie.github.io/NainaiPaohuzi/'));
      addSection(box, '设备与页面', [
        ['User-Agent', navigator.userAgent],
        ['系统 WebView', native || '（原生未返回）', !native || native.indexOf('未找到') !== -1],
        ['页面地址', location.href],
        ['窗口尺寸', window.innerWidth + ' × ' + window.innerHeight + '，像素比 ' + (window.devicePixelRatio || 1)],
        ['屏幕尺寸', (screen.width || 0) + ' × ' + (screen.height || 0)],
        ['main 高度', mainHeight, !mainRect || Math.round(mainRect.height) <= 0],
        ['首页位置', homeRect ? Math.round(homeRect.left) + ', ' + Math.round(homeRect.top) + '，' + Math.round(homeRect.width) + '×' + Math.round(homeRect.height) : '未找到 #home'],
        ['Chrome 版本', chrome || '未能识别', !chrome || chrome < 69],
        ['渲染模式', document.documentElement.dataset.renderer || '未选择']
      ]);
      var features = [
        ['ES 模块（<script type="module">）', typeof HTMLScriptElement !== 'undefined' && 'noModule' in HTMLScriptElement.prototype],
        ['可选链 a?.b', jsFeature('var a={b:1};return a?.b')],
        ['空值合并 a ?? b', jsFeature('var a=null;return a ?? 1')],
        ['Array.prototype.at', jsFeature('return [1,2].at(-1)')],
        ['Object.hasOwn', jsFeature('return Object.hasOwn({a:1},"a")')],
        ['Array.prototype.findLast', jsFeature('return [1,2].findLast(function(x){return x>1})')],
        ['Promise.allSettled', jsFeature('return typeof Promise.allSettled === "function"')],
        ['Object.fromEntries', jsFeature('return typeof Object.fromEntries === "function"')],
        ['Array.prototype.flatMap', jsFeature('return [1].flatMap(function(x){return [x]})')],
        ['String.prototype.replaceAll', jsFeature('return "aa".replaceAll("a","b")')],
        ['Element.getAnimations（Chrome 84+）', getAnimations],
        ['Animation.finished（Chrome 84+）', finished]
      ];
      var featureRows = [];
      for (var index = 0; index < features.length; index++) {
        featureRows.push([features[index][0], features[index][1] ? '支持' : '不支持', !features[index][1]]);
      }
      addSection(box, '浏览器功能检测', featureRows);
      addSection(box, 'CSS 检测', [
        ['100dvh（Chrome 108+）', dvh ? '支持' : '不支持', !dvh],
        ['clamp()（Chrome 79+）', clamp ? '支持' : '不支持', !clamp],
        [':is()（Chrome 88+）', is ? '支持' : '不支持', !is],
        [':where()（Chrome 88+）', where ? '支持' : '不支持', !where],
        [':has()（Chrome 105+）', has ? '支持' : '不支持', !has],
        ['flex 的 gap（Chrome 84+）', flexGapOk ? '支持' : '不支持', !flexGapOk],
        ['inset 简写（Chrome 87+）', inset ? '支持' : '不支持', !inset],
        ['translate 属性（Chrome 104+）', translate ? '支持' : '不支持', !translate],
        ['aspect-ratio（Chrome 88+）', aspect ? '支持' : '不支持', !aspect],
        ['subgrid（Chrome 117+）', subgrid ? '支持' : '不支持', !subgrid],
        ['@container（Chrome 105+）', container ? '支持' : '不支持', !container],
        ['backdrop-filter（Chrome 76+）', backdrop ? '支持' : '不支持', !backdrop],
        ['CSS Grid（Chrome 57+）', grid ? '支持' : '不支持', !grid],
        ['env(safe-area-inset-*)（Chrome 69+）', safeArea ? '支持' : '不支持', !safeArea]
      ]);
      box.appendChild(element('h3', 'margin:18px 0 6px;font-size:18px;color:#ffe2a0;', '错误记录'));
      errorList = element('div', 'margin-bottom:6px;');
      box.appendChild(errorList);
      renderErrors();
      var actions = element('div', 'margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;');
      var reload = element('button', 'font:17px system-ui,sans-serif;font-weight:700;padding:10px 22px;border-radius:10px;border:1px solid #d6a35e;background:#2a5a48;color:#fff0c9;', '重新加载');
      reload.onclick = function () { location.reload(); };
      var close = element('button', 'font:17px system-ui,sans-serif;padding:10px 22px;border-radius:10px;border:1px solid #7a9a8a;background:#173a30;color:#e8f0e6;', '关闭提示');
      close.onclick = function () { hide(); miniButton(); };
      actions.appendChild(reload);
      actions.appendChild(close);
      box.appendChild(actions);
      document.body.appendChild(panel);
      if (poll) window.clearInterval(poll);
      poll = window.setInterval(function () {
        if (window.__paohuziStarted) hide();
      }, 800);
    }

    function schedule() {
      window.setTimeout(function () {
        if (window.__paohuziStarted) return;
        show();
      }, 4000);
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', schedule);
    else schedule();
    window.addEventListener('load', schedule);
  })();
  </script>
  <script defer src="./js/bootstrap.js?v=266"></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></symbol>
    <symbol id="icon-power" viewBox="0 0 24 24"><path d="M12 3v8m-5.7-5a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <path d="M10 3h4l.6 2.5 1.7 1 2.5-.7 2 3.4-1.9 1.8v2l1.9 1.8-2 3.4-2.5-.7-1.7 1-.6 2.5h-4l-.6-2.5-1.7-1-2.5.7-2-3.4 1.9-1.8v-2L3.2 9.2l2-3.4 2.5.7 1.7-1z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 5v6h-6"/></symbol>
    <symbol id="icon-person" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></symbol>
  </svg>
  <main>
    <section id="home" class="front-screen" aria-labelledby="home-title">
      <button id="exit-game" class="icon-button" type="button" aria-label="退出游戏" hidden><svg class="nav-icon" aria-hidden="true"><use href="#icon-power"/></svg></button>
      <header class="home-top">
        <button id="open-profile" type="button">
          <span class="profile-avatar" aria-hidden="true">
            <img alt="" hidden>
            <svg class="nav-icon"><use href="#icon-person"/></svg>
          </span>
          <span id="home-nickname"></span>
        </button>
        <button id="open-settings" class="icon-button" type="button" aria-label="设置"><svg class="nav-icon" aria-hidden="true"><use href="#icon-settings"/></svg></button>
      </header>
      <div class="home-brand">
        <h1 id="home-title">衡阳跑胡子</h1>
        <div class="title-tiles" aria-hidden="true"><span class="card red">贰</span><span class="card red">柒</span><span class="card red">拾</span></div>
      </div>
      <div class="modes" role="group" aria-label="选择玩法"></div>
    </section>
    <section id="round-setup" class="front-screen" hidden aria-labelledby="mode-title">
      <header class="menu-header">
        <button class="icon-button" type="button" data-back-home aria-label="返回首页"><svg class="nav-icon" aria-hidden="true"><use href="#icon-back"/></svg></button>
        <button id="setup-tutorial" type="button" aria-haspopup="dialog">教程</button>
      </header>
      <div class="setup-summary">
        <h2 id="mode-title"></h2>
        <dl class="setup-score">
          <dt>累计积分</dt>
          <dd><strong id="mode-score"></strong> 分</dd>
        </dl>
      </div>
      <div class="setup-controls">
        <div id="paohuzi-options" class="menu-options" role="group" aria-label="本局规则">
          <label>一五十<input type="checkbox" name="oneFiveTen" role="switch"></label>
          <label>放炮胡<input type="checkbox" name="discardHu" role="switch"></label>
          <label><span id="meld-visibility">明提明偎</span><input type="checkbox" name="openMelds" role="switch" aria-label="明提明偎，关闭后暗提暗偎"></label>
        </div>
        <div id="mahjong-seats" class="menu-options seat-picker" role="group" aria-label="玩家人数" hidden>
          <button type="button" data-seats="3" aria-pressed="true">3 人</button>
          <button type="button" data-seats="4" aria-pressed="false">4 人</button>
          <button type="button" data-seats="5" aria-pressed="false">5 人</button>
        </div>
        <button id="start" type="button" class="primary">开始游戏</button>
      </div>
    </section>
    <section id="settings" class="front-screen" hidden aria-labelledby="settings-title">
      <header class="menu-header">
        <button class="icon-button" type="button" data-back-home aria-label="返回首页"><svg class="nav-icon" aria-hidden="true"><use href="#icon-back"/></svg></button>
        <h2 id="settings-title">设置</h2>
      </header>
      <div class="settings-content">
        <div class="menu-options shared-settings"></div>
        <section id="app-update" aria-label="版本信息" hidden>
          <p id="app-version" data-web-version=""></p>
          <div class="update-controls" hidden>
            <button id="check-update" type="button">检查更新</button>
            <button id="install-update" class="primary" type="button" hidden>安装</button>
            <div id="update-download" hidden>
              <progress id="update-progress" max="100" aria-label="下载进度"></progress>
              <span id="update-percent"></span>
            </div>
            <button id="cancel-update-download" type="button" hidden>取消下载</button>
          </div>
          <p id="update-status" role="status" hidden></p>
          <label hidden><input type="checkbox" id="force-compat"> 强制兼容模式</label>
        </section>
      </div>
    </section>
    <section id="profile" class="front-screen" hidden aria-label="个人页面">
      <header class="menu-header">
        <button class="icon-button" type="button" data-back-home aria-label="返回首页"><svg class="nav-icon" aria-hidden="true"><use href="#icon-back"/></svg></button>
      </header>
      <div id="profile-editor">
        <div class="profile-photo">
          <span class="profile-avatar" aria-hidden="true">
            <img alt="" hidden>
            <svg class="nav-icon"><use href="#icon-person"/></svg>
          </span>
        </div>
        <strong id="profile-display-name"></strong>
        <div class="actions profile-actions">
          <button id="choose-avatar" type="button">上传头像</button>
          <button id="edit-nickname" type="button" aria-haspopup="dialog">修改昵称</button>
        </div>
        <input id="avatar-file" type="file" accept="image/*" hidden>
        <p id="profile-status" role="status"></p>
      </div>
      <ul class="score-records" aria-label="各玩法积分"></ul>
    </section>
    <section id="table" class="wide" hidden aria-label="牌桌"></section>
    <dialog id="eat-menu" aria-label="选择吃法"></dialog>
  </main>
  <dialog id="update-dialog" class="game-dialog" aria-labelledby="update-title" aria-describedby="update-description">
    <h2 id="update-title">发现新版本</h2>
    <p id="update-description"></p>
    <form method="dialog" class="actions">
      <button value="cancel" autofocus>取消</button>
      <button id="download-update" class="primary" value="download">下载</button>
    </form>
  </dialog>
  <dialog id="score-reset-dialog" class="game-dialog" aria-labelledby="score-reset-title">
    <h2 id="score-reset-title"></h2>
    <form method="dialog" class="actions">
      <button value="cancel" autofocus>取消</button>
      <button id="confirm-score-reset" class="primary">清零</button>
    </form>
  </dialog>
  <dialog id="nickname-dialog" class="game-dialog" aria-labelledby="nickname-title">
    <form class="profile-name-edit">
      <h2 id="nickname-title">修改昵称</h2>
      <label class="sr-only" for="profile-nickname">昵称</label>
      <input id="profile-nickname" name="nickname" type="text" maxlength="16" autocomplete="nickname" placeholder="昵称" autofocus>
      <div class="actions">
        <button type="button" id="cancel-nickname">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
      <p id="nickname-status" role="status"></p>
    </form>
  </dialog>
  <dialog id="pause-menu" class="game-dialog" aria-labelledby="pause-title">
    <form method="dialog">
      <header class="dialog-header">
        <h2 id="pause-title">设置</h2>
        <button class="icon-button" aria-label="关闭设置" autofocus><svg class="nav-icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
      </header>
      <div class="pause-settings shared-settings"></div>
      <div class="actions"><button id="pause-tutorial" type="button" aria-haspopup="dialog">教程</button></div>
    </form>
  </dialog>
  <dialog id="tutorial" class="game-dialog" aria-labelledby="tutorial-title">
    <form method="dialog" class="dialog-header">
      <h2 id="tutorial-title"></h2>
      <button class="icon-button" aria-label="关闭教程"><svg class="nav-icon" aria-hidden="true"><use href="#icon-close"/></svg></button>
    </form>
    <div class="tutorial-tabs" role="tablist" aria-label="教程章节">
      <button id="tutorial-start-tab" type="button" role="tab" aria-controls="tutorial-start" aria-selected="true" autofocus>快速上手</button>
      <button id="tutorial-hu-tab" type="button" role="tab" aria-controls="tutorial-hu" aria-selected="false" tabindex="-1">胡牌</button>
      <button id="tutorial-score-tab" type="button" role="tab" aria-controls="tutorial-score" aria-selected="false" tabindex="-1">计分</button>
    </div>
    <div id="tutorial-start" class="tutorial-panel" role="tabpanel" aria-labelledby="tutorial-start-tab" tabindex="0"></div>
    <div id="tutorial-hu" class="tutorial-panel" role="tabpanel" aria-labelledby="tutorial-hu-tab" tabindex="0" hidden></div>
    <div id="tutorial-score" class="tutorial-panel" role="tabpanel" aria-labelledby="tutorial-score-tab" tabindex="0" hidden></div>
  </dialog>
  <dialog id="leave-menu" class="game-dialog" aria-labelledby="leave-title" aria-describedby="leave-description">
    <h2 id="leave-title">返回首页？</h2>
    <p id="leave-description">放弃后，本局无法恢复。</p>
    <form method="dialog">
      <div class="actions">
        <button value="discard">放弃对局</button>
        <button class="primary" value="resume" autofocus>继续打牌</button>
      </div>
    </form>
  </dialog>
  <dialog id="resume-menu" class="game-dialog" aria-labelledby="resume-title" aria-describedby="resume-description">
    <h2 id="resume-title">继续上次对局？</h2>
    <p id="resume-description">取消会放弃上次对局。</p>
    <form method="dialog" class="actions">
      <button value="cancel">取消</button>
      <button class="primary" value="resume" autofocus>继续对局</button>
    </form>
  </dialog>
  <template id="shared-setting-controls">
    <div class="audio-setting">
      <label>游戏音效<input type="checkbox" name="sound" role="switch"></label>
      <div class="volume-control">
        <input type="range" name="soundVolume" min="0" max="100" step="5" aria-label="游戏音效音量">
        <output aria-hidden="true"></output>
      </div>
    </div>
