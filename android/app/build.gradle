plugins {
    id 'com.android.application' version '8.6.1'
}

android {
    namespace 'io.github.hijie.nainaipaohuzi'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.hijie.nainaipaohuzi'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
