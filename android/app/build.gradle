plugins {
    id 'com.android.application' version '8.6.1'
}

def appVersion = new groovy.json.JsonSlurper().parse(file('version.json'))

android {
    namespace 'io.github.hijie.nainaipaohuzi'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.hijie.nainaipaohuzi'
        minSdk 26
        targetSdk 35
        versionCode appVersion.versionCode
        versionName appVersion.versionName
        buildConfigField 'boolean', 'COMPATIBILITY_TESTING',
                providers.gradleProperty('compatibilityTesting').map { it.toBoolean().toString() }.getOrElse('true')
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystorePath = providers.environmentVariable('PAOHUZI_SIGNING_STORE_FILE').orNull
            if (keystorePath) {
                storeFile = file(keystorePath)
            }
            storePassword = providers.environmentVariable('PAOHUZI_SIGNING_STORE_PASSWORD').orNull
            keyAlias = providers.environmentVariable('PAOHUZI_SIGNING_KEY_ALIAS').orNull
            keyPassword = providers.environmentVariable('PAOHUZI_SIGNING_KEY_PASSWORD').orNull
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def buildCompatibilityAssets = tasks.register('buildCompatibilityAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/build-compat.mjs'
    inputs.files fileTree('src/main/assets/www') { include 'css/**', 'js/**', 'media/audio/music/playlist.mjs' }
    inputs.files fileTree('../../scripts') { include '*compat*' }
    inputs.file '../../package-lock.json'
    outputs.dir 'src/main/assets/www/compat'
}

tasks.named('preBuild').configure {
    dependsOn buildCompatibilityAssets
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
